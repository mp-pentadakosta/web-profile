name: web-profile CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: web-profile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build . \
            -t ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG} \
            -t ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:latest

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS using SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST_DEV }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            NAME=web-profile
            IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/${NAME}:${{ github.sha }}
            PORT=3008

            echo ">>> Pull image terbaru"
            docker pull $IMAGE_NAME

            echo ">>> Stop old container"
            docker stop $NAME || true

            echo ">>> Remove old container"
            docker rm $NAME || true

            echo ">>> Run new container"
            docker run -d \
              --name $NAME \
              --restart unless-stopped \
              -p ${PORT}:80 \
              $IMAGE_NAME

            echo ">>> Bersihkan image tidak terpakai"
            docker image prune -a -f
